name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # biome check + tsc --noEmit + vitest run
      - run: npm run check

      # Build-only validation: no Cloudflare credentials needed, nothing is deployed.
      - run: npx wrangler deploy --dry-run --outdir dist
