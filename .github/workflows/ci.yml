name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 10.9 (bundled with Node 22) has an Arborist crash on this lockfile.
      # See docs/DEPENDENCY_NOTES.md.
      - run: npm i -g npm@11

      - run: npm ci

      # biome check + tsc --noEmit + vitest run
      - run: npm run check

      # Build-only validation: no Cloudflare credentials needed, nothing is deployed.
      - run: npx wrangler deploy --dry-run --outdir dist
