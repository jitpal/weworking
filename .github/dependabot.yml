version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # @cloudflare/vitest-pool-workers pins vitest 4.x; bump them together by hand.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # Biome and the workers types are only tested on TypeScript 5.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # agents pins these exact versions; they move with agents.
      - dependency-name: "@modelcontextprotocol/*"
        update-types: ["version-update:semver-major"]
    groups:
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
          - "agents"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
